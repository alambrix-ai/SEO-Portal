# Console server. This file is a TEMPLATE: docker-entrypoint.sh renders it at
# container start with envsubst limited to the API_ORIGIN and CSP_REPORT_URI
# placeholders (nothing else is substituted, so nginx's own $variables pass
# through).
#
# Security headers live in /etc/nginx/snippets/security-headers.conf, written
# by docker-entrypoint.sh, and are included in EVERY location. A location
# with its own add_header drops all inherited server-level add_header lines,
# and nginx 1.27 has no add_header_inherit.

# Content-Security-Policy (research R9).
# - script-src 'self': dist has no inline scripts and no eval; three.js and
#   /config.js are same-origin.
# - style-src hash: the article preview's inline <style> in ContentPage.tsx
#   (srcdoc iframes inherit this policy). Recompute it if that string
#   changes. Email previews lose their inline styles; no 'unsafe-inline'.
# - img-src: favicons from Google and icon.horse (official-logos.ts).
# - report-uri / report-to: violations go to the API's POST /csp-report
#   (${CSP_REPORT_URI}, /api/v1/csp-report by default). report-to uses the
#   "csp-endpoint" group from the Reporting-Endpoints header; browsers that
#   understand it ignore report-uri.
map $request_uri $console_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'sha256-gEXg8wJ6NZcXg9kwIBG4qfliEImxcABXgQQr+woqmd8='; font-src https://fonts.gstatic.com; img-src 'self' blob: data: https://www.google.com https://*.gstatic.com https://icon.horse ${API_ORIGIN}; connect-src 'self' ${API_ORIGIN}; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; report-uri ${CSP_REPORT_URI}; report-to csp-endpoint";
}

# HSTS only when the TLS-terminating proxy says the request came over HTTPS.
# An empty value makes add_header send nothing.
map $http_x_forwarded_proto $console_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 10000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
