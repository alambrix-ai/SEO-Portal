# Self-hosted stack: PostgreSQL (with TLS), Redis, a one-shot migration job,
# the API, Celery workers (general and render), Celery beat, and the console.
# This is the production deployment; see docs/deployment.md for settings,
# TRUSTED_PROXIES per topology, upgrades and rollback.
#
# First run:
#
#   cp .env.compose.example .env           # fill in every value it asks for
#   docker compose up -d postgres
#   # One-time role setup (two roles: schema owner and app). The passwords
#   # are psql variables with no defaults (16+ characters, different); keep
#   # them in a secret manager and put the same values in the two DSNs in
#   # .env. Prompts for the POSTGRES_PASSWORD superuser password.
#   export AUTOMARKET_OWNER_PASSWORD="$(openssl rand -hex 32)"
#   export AUTOMARKET_APP_PASSWORD="$(openssl rand -hex 32)"
#   docker compose exec postgres psql -U automarket -d postgres \
#     -v owner_password="$AUTOMARKET_OWNER_PASSWORD" \
#     -v app_password="$AUTOMARKET_APP_PASSWORD" \
#     -f /bootstrap/bootstrap.sql
#   docker compose --profile production up -d --build     # nginx console
#   docker compose --profile dev up --build               # or: Vite console
#
# How it fits together:
#   - `migrate` runs `alembic upgrade head` once, as the schema owner
#     (MIGRATION_DATABASE_URL), and exits. Everything else waits for it to
#     finish successfully and connects as `automarket_app` (DATABASE_URL), so
#     the running service owns nothing and cannot change the schema, bypass
#     row-level security, or rewrite the audit log.
#   - The API, workers and beat set RUN_MIGRATIONS=false. Render and local
#     runs of the image keep the default and migrate on start.
#   - CELERY_ENABLED=true moves agent runs and Creative Studio jobs off the
#     API: `worker` takes the general queue, `render-worker` the "render"
#     queue (headless Chromium), and `beat` is the only scheduler.
#
# Secrets: the app containers read .env, but the owner DSN and the bundled
# PostgreSQL superuser password are blanked for them below; only `migrate`
# sees the owner DSN. `${VAR:?...}` makes compose refuse to start without a
# required value, so a placeholder cannot quietly become a deployed one.
#
# Published ports bind to 127.0.0.1 by default: put a TLS-terminating reverse
# proxy in front (and set TRUSTED_PROXIES, see .env.compose.example).
#
# Redis requires REDIS_PASSWORD (letters and digits only, it goes into the
# redis:// URLs). The backend containers run with a read-only root
# filesystem and a tmpfs /tmp. The render worker sits on its own network,
# shared only with PostgreSQL and Redis, so a compromised browser cannot reach
# the API, the other workers or the console.
#
# Using a managed PostgreSQL instead of the bundled one: run bootstrap.sql
# against it as an administrator, point both DSNs at it, and remove the
# `postgres` service and the `depends_on: postgres` entries.

x-backend-build: &backend-build
  context: ./backend

# Shared by every container that runs the backend image. The app's own
# settings come from .env; these lines override what must not vary.
x-backend-env: &backend-env
  CELERY_ENABLED: "true"
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/1
  # Read by beat's healthcheck and the heartbeat task.
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  RUN_MIGRATIONS: "false"
  # The root filesystem is read-only; anything that wants a home directory
  # uses the tmpfs.
  HOME: /tmp
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (the automarket_app DSN) in .env}
  # The owner DSN and the bundled database's superuser password never reach a
  # long-running container.
  MIGRATION_DATABASE_URL: ""
  POSTGRES_PASSWORD: ""

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# Read-only root filesystem; only /tmp is writable, and lost on restart.
x-read-only: &read-only
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

x-after-migrate: &after-migrate
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    # The Debian image, not -alpine: it ships the snakeoil certificate the
    # ssl_cert_file/ssl_key_file lines below point at. For a real
    # certificate, mount it read-only and change those two paths.
    image: postgres:17
    container_name: automarket-postgres
    environment:
      POSTGRES_DB: automarket
      POSTGRES_USER: automarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Scram rather than md5, enforced from initdb onwards.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      # Not 5432, so it cannot collide with a PostgreSQL already on the host.
      # Loopback only: the database is never reachable from the network.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # For the one-time role setup above; read-only and not an init script,
      # so it never runs on its own with the passwords still unchanged.
      - ./backend/scripts/bootstrap.sql:/bootstrap/bootstrap.sql:ro
    command:
      - postgres
      # TLS in development too, so the "encrypted in transit" path is the one
      # actually exercised rather than a production-only branch.
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automarket -d automarket"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [default, render]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: automarket-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # redis-cli reads the password from here, so it is never in argv.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # The password goes in on stdin as a config line (the trailing "-"), not
    # on the command line where `ps` would show it. Letters and digits only,
    # 24 or more: it is also part of the redis:// URLs above. The image's own
    # entrypoint still runs, so Redis drops to the redis user, and `exec`
    # leaves Redis as PID 1 to receive the stop signal.
    command:
      - sh
      - -c
      - |
        case "$$REDIS_PASSWORD" in
          *[!A-Za-z0-9]*) echo "REDIS_PASSWORD must be letters and digits only" >&2; exit 1 ;;
        esac
        if [ "$${#REDIS_PASSWORD}" -lt 24 ]; then
          echo "REDIS_PASSWORD must be at least 24 characters" >&2; exit 1
        fi
        exec docker-entrypoint.sh redis-server --save 60 1 --appendonly no - <<EOF
        requirepass $$REDIS_PASSWORD
        EOF
    ports:
      # Loopback only, and password-protected.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [default, render]
    restart: unless-stopped

  # One-shot: migrate as the schema owner, then exit 0. A failed migration
  # stops the rest of the stack from starting.
  migrate:
    build: *backend-build
    image: automarket-backend:local
    container_name: automarket-migrate
    <<: [*hardening, *read-only]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *backend-env
      CELERY_ENABLED: "false"
      # Alembic imports Settings and never renders; pillow satisfies the
      # production Chromium guardrail (CREATIVE_RENDER_ISOLATED is only on
      # render-worker).
      CREATIVE_RENDERER: "pillow"
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL (the automarket_owner DSN) in .env}
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
          pids: 64
    restart: "no"

  api:
    build: *backend-build
    image: automarket-backend:local
    container_name: automarket-api
    <<: [*hardening, *read-only]
    depends_on: *after-migrate
    env_file: .env
    environment:
      <<: *backend-env
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:8000:8000"
    # --no-proxy-headers: the app walks X-Forwarded-For itself against
    # TRUSTED_PROXIES, so uvicorn must not rewrite the client address first.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 256
    restart: unless-stopped

  # General queue. No `-B`: beat runs once, in its own service, or every
  # worker replica would fire every schedule.
  worker:
    build: *backend-build
    image: automarket-backend:local
    container_name: automarket-worker
    <<: [*hardening, *read-only]
    depends_on: *after-migrate
    env_file: .env
    environment:
      <<: *backend-env
    command:
      - celery
      - -A
      - app.orchestration.tasks
      - worker
      - -Q
      - celery
      - -n
      - celery@default
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      - --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-50}
      - --loglevel=info
    healthcheck:
      test: ["CMD", "celery", "-A", "app.orchestration.tasks", "inspect", "ping", "-d", "celery@default", "-t", "5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "1.5"
          pids: 256
    restart: unless-stopped

  # The "render" queue: Creative Studio jobs and redraws, one headless
  # Chromium per process. Chromium runs without its own sandbox here (it
  # needs user namespaces), so the container is the sandbox: no capabilities,
  # no privilege escalation, read-only root, tmpfs /tmp, and memory, CPU and
  # process limits. Raise mem_limit with CELERY_RENDER_CONCURRENCY.
  #
  # Network: its own `render` network, shared only with PostgreSQL and Redis,
  # so it cannot reach the API, the other workers or the console. It cannot
  # be `internal: true`, because a creative job also calls the chosen text
  # and image model APIs. The browser itself loads nothing (JavaScript off,
  # every request aborted, all DNS mapped to NOTFOUND, assets inlined).
  # Restrict this container's outbound internet traffic to the model
  # vendors' hosts with a host firewall or an egress proxy.
  render-worker:
    build: *backend-build
    image: automarket-backend:local
    container_name: automarket-render-worker
    <<: *hardening
    depends_on: *after-migrate
    env_file: .env
    environment:
      <<: *backend-env
      # Only this service. Production accepts unsandboxed Chromium only
      # together with CELERY_ENABLED (renders leave the API process); see
      # docs/deployment.md.
      CREATIVE_RENDER_ISOLATED: "true"
    networks: [render]
    command:
      - celery
      - -A
      - app.orchestration.tasks
      - worker
      - -Q
      - render
      - -c
      - ${CELERY_RENDER_CONCURRENCY:-1}
      - -P
      - prefork
      - --max-tasks-per-child
      - "50"
      - --max-memory-per-child
      - "1500000"
      - -n
      - celery@render
      - --loglevel=info
    init: true
    shm_size: 1gb
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test: ["CMD", "celery", "-A", "app.orchestration.tasks", "inspect", "ping", "-d", "celery@render", "-t", "5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 512
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
          pids: 512
    restart: unless-stopped

  # The only scheduler. Exactly one replica: two would fire every job twice.
  # Healthy while beat:hb in Redis is under 120 s old. A worker runs the
  # heartbeat task beat schedules, so this also goes unhealthy when no
  # worker is up.
  beat:
    build: *backend-build
    image: automarket-backend:local
    container_name: automarket-beat
    <<: *hardening
    depends_on: *after-migrate
    env_file: .env
    environment:
      <<: *backend-env
    command:
      - celery
      - -A
      - app.orchestration.tasks
      - beat
      - --schedule
      - /tmp/celerybeat-schedule
      - --pidfile=
      - --loglevel=info
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time,redis; v=redis.Redis.from_url(os.environ['REDIS_URL'],socket_timeout=5,socket_connect_timeout=5).get('beat:hb'); sys.exit(0 if v and time.time()-int(v)<120 else 1)"
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
    mem_limit: 384m
    cpus: 0.25
    pids_limit: 64
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 384m
          cpus: "0.25"
          pids: 64
    restart: unless-stopped

  # Development console (Vite, live reload): `docker compose --profile dev up`.
  console:
    build:
      context: ./frontend
      target: development
    container_name: automarket-console
    profiles: ["dev"]
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      # Loopback only: the dev server is not hardened for a network.
      - "127.0.0.1:5173:5173"
    restart: unless-stopped

  # Production console (nginx, static build, CSP and security headers):
  # `docker compose --profile production up`. Serve it and the API on one
  # origin through the reverse proxy (/ -> this, /api -> api:8000), or set
  # VITE_API_BASE_URL to the API's https URL.
  console-prod:
    build:
      context: ./frontend
      target: production
    container_name: automarket-console-prod
    profiles: ["production"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      # Report-Only until the policy has run clean for a release.
      CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-true}
    ports:
      - "${PUBLISH_ADDR:-127.0.0.1}:8080:10000"
    # The entrypoint writes its rendered files to /tmp (see frontend/Dockerfile).
    # The image is nginx-unprivileged: nginx runs as uid 101 from the start,
    # keeps its pid file and temp paths under /tmp and listens above 1024, so
    # it needs no capabilities and no other writable path.
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
          pids: 64
    restart: unless-stopped

# A pinned subnet, so TRUSTED_PROXIES can name the gateway (a reverse proxy on
# the host reaches the API from 172.28.0.1) or a proxy container's address.
# Change both together if this range collides with your network.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  # The render worker's network: PostgreSQL, Redis and the render worker only.
  render:
    ipam:
      config:
        - subnet: 172.28.1.0/24

volumes:
  postgres_data:
