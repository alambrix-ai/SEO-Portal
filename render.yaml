# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Render does not run a docker-compose stack as one deployable unit. Instead,
# this blueprint maps each compose concern to a Render resource:
#   - frontend container -> public web service
#   - backend container  -> public web service
#   - PostgreSQL         -> Render managed Postgres
#   - Redis/Celery       -> Render Key Value + background worker
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. In Render, choose New -> Blueprint and point it at the repo.
#   3. After the first sync, open the created services and update the
#      placeholder public URLs below if Render assigned suffixes.

envVarGroups:
  - name: automarket-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: POSTGRES_SSLMODE
        value: require
      - key: FORCE_HTTPS
        value: "true"
      - key: SECURE_COOKIES
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: PUBLIC_BASE_URL
        value: https://automarket-console.onrender.com
      - key: TRUSTED_HOSTS
        value: automarket-api.onrender.com,automarket-console.onrender.com
      - key: CORS_ORIGINS
        value: https://automarket-console.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: anthropic
      - key: SMTP_PORT
        value: "587"
      - key: EMAIL_FROM_NAME
        value: AutoMarket AI

databases:
  - name: automarket-db
    plan: starter
    postgresMajorVersion: "17"
    region: oregon

services:
  - type: keyvalue
    name: automarket-cache
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: automarket-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers"
    envVars:
      - fromGroup: automarket-shared
      - key: DATABASE_URL
        fromDatabase:
          name: automarket-db
          property: connectionString
      - key: MASTER_ENCRYPTION_KEY
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: CELERY_ENABLED
        value: "true"
      - key: CELERY_BROKER_URL
        fromService:
          name: automarket-cache
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: automarket-cache
          type: keyvalue
          property: connectionString

  - type: worker
    name: automarket-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.orchestration.tasks.celery_app worker -B --loglevel=info
    envVars:
      - fromGroup: automarket-shared
      - key: DATABASE_URL
        fromDatabase:
          name: automarket-db
          property: connectionString
      - key: MASTER_ENCRYPTION_KEY
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: CELERY_ENABLED
        value: "true"
      - key: CELERY_BROKER_URL
        fromService:
          name: automarket-cache
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: automarket-cache
          type: keyvalue
          property: connectionString

  - type: web
    name: automarket-console
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://automarket-api.onrender.com/api/v1
