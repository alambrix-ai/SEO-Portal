# Free-tier Render Blueprint — https://render.com/docs/blueprint-spec
#
# Target stack (all free):
#   - automarket-api:     Docker web service on Render free plan
#   - automarket-console: Static site on Render (always free)
#   - Postgres:           Neon free (create outside Render, paste DATABASE_URL)
#
# Not used on this free path:
#   - Redis / Key Value
#   - Celery worker
#   - Render-managed Postgres
#
# Deploy:
#   1. Create a free Neon project and copy the connection string.
#   2. Push this repo to GitHub.
#   3. In Render: New -> Blueprint, select the repo.
#   4. Paste secrets when prompted (Neon URL, encryption keys, SMTP, LLM).
#   5. After deploy, fix PUBLIC_BASE_URL / CORS / VITE_API_BASE_URL if Render
#      assigned different subdomains than the placeholders below.
#
# Free-tier notes:
#   - The API sleeps after ~15 minutes idle; the first request wakes it slowly.
#   - SCHEDULER_ENABLED only runs while the instance is awake.

services:
  - type: web
    name: automarket-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Migrations + uvicorn live in backend/docker-entrypoint.sh (Dockerfile CMD).
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: POSTGRES_SSLMODE
        value: require
      - key: FORCE_HTTPS
        value: "true"
      - key: SECURE_COOKIES
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # Paste your Neon connection string in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Console URL — update after first deploy if the subdomain differs.
      - key: PUBLIC_BASE_URL
        value: https://automarket-console.onrender.com
      - key: TRUSTED_HOSTS
        value: automarket-api.onrender.com
      - key: CORS_ORIGINS
        value: https://automarket-console.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
      # In-process scheduler; no Redis/Celery on the free path.
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_SPEED
        value: "1.0"
      - key: CELERY_ENABLED
        value: "false"
      # Agent writing models come from Connectors (per agent), not env keys.
      - key: LLM_EFFORT
        value: medium
      - key: LLM_MAX_TOKENS
        value: "16000"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: AutoMarket AI
      # Prefer this on Render free — SMTP ports are blocked.
      - key: RESEND_API_KEY
        sync: false

  - type: web
    name: automarket-console
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # Baked in at build time — update and rebuild if the API subdomain differs.
      - key: VITE_API_BASE_URL
        value: https://automarket-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
