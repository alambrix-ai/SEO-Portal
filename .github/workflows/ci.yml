# Synaprank.ai CI — unit/integration tests, frontend quality, dependency and
# secret scanning. Secret scanning and high npm advisories fail the job.
# Python pip-audit / Bandit / Semgrep run and upload findings; known backlog
# is non-blocking until a dedicated dependency-hardening PR (see PLAN.md).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  SECRET_KEY: test-secret-key-at-least-32-characters-long!!
  MASTER_ENCRYPTION_KEY: YXV0b21hcmtldC10ZXN0LW1hc3Rlci1rZXktMzJieXQ=
  BLIND_INDEX_KEY: YXV0b21hcmtldC10ZXN0LWJsaW5kLWluZGV4LTMyYnk=
  RATE_LIMIT_ENABLED: "false"
  LOGIN_CODE_RESEND_SECONDS: "0"
  SCHEDULER_ENABLED: "false"
  ANTHROPIC_API_KEY: test-key-not-used
  LLM_PROVIDER: anthropic
  LLM_MODEL: test-model-not-called
  # config.py re-reads backend/.env if DATABASE_URL is unset — always set a dummy.
  DATABASE_URL: postgresql+psycopg://nobody:nopass@127.0.0.1:1/none_test

jobs:
  backend-unit:
    name: Backend pytest (no database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Pytest (logic only)
        run: |
          env -u TEST_DATABASE_URL \
            DATABASE_URL="postgresql+psycopg://nobody:nopass@127.0.0.1:1/none_test" \
            python -m pytest -q -p no:cacheprovider

  backend-integration:
    name: Backend pytest (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: synaprank
          POSTGRES_PASSWORD: synaprank_ci
          POSTGRES_DB: automarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synaprank -d automarket_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Pytest (with database)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://synaprank:synaprank_ci@127.0.0.1:5432/automarket_test
          DATABASE_URL: postgresql+psycopg://synaprank:synaprank_ci@127.0.0.1:5432/automarket_test
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  security:
    name: Dependency, secret, and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install pip-audit==2.7.3 bandit==1.8.3 semgrep==1.110.0

      - name: pip-audit
        working-directory: backend
        # Non-blocking while pinned FastAPI/Pillow/cryptography backlog is
        # cleared in a dedicated hardening PR (docs/roadmap/PLAN.md Phase 0 note).
        continue-on-error: true
        run: pip-audit -r requirements.txt --progress-spinner off | tee pip-audit.txt

      - name: Bandit (high severity)
        working-directory: backend
        continue-on-error: true
        run: bandit -q -r app -lll -c .bandit | tee bandit.txt

      - name: Semgrep (Python + OWASP)
        continue-on-error: true
        run: |
          semgrep --disable-version-check --metrics=off \
            --config=p/python \
            --config=p/owasp-top-ten \
            backend/app | tee semgrep.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (high+)
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
